name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支只跑最新一次，节省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # 仅用于 prisma generate 与 next build 的占位值，不连接真实数据库
      DATABASE_URL: postgresql://user:pass@localhost:5432/ci
      DIRECT_URL: postgresql://user:pass@localhost:5432/ci
      AUTH_SECRET: ci-only-secret-not-for-production
      AUTH_TRUST_HOST: "true"
      ZHIPU_API_KEY: ci-dummy
      ZHIPU_BASE_URL: https://open.bigmodel.cn/api/paas/v4
      UPSTASH_REDIS_REST_URL: https://example.upstash.io
      UPSTASH_REDIS_REST_TOKEN: ci-dummy
      TAVILY_API_KEY: ci-dummy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build
